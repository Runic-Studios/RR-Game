name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

env:
  ARTIFACT_NAME: 'rr-game'
  REGISTRY: 'registry.runicrealms.com'
  REGISTRY_PROJECT: 'library'

jobs:
  build-preview:
    runs-on: rr-runner
    container:
      image: registry.runicrealms.com/agents/agent-java-21:latest
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA and commit message
        id: sha
        run: |
          echo "sha7=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "commit_message=$(git log -1 --pretty=%s ${{ github.event.pull_request.head.sha }})" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            wrapper
            notifications
            jdks

      - name: Build with Gradle
        env:
          RUNIC_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          RUNIC_GIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUNIC_GIT_MESSAGE: ${{ steps.sha.outputs.commit_message }}
          RUNIC_BUILD_ID: ${{ github.run_id }}
        run: ./gradlew :plugin:shadowJar --no-daemon

      - name: Push Artifact to ORAS
        uses: Runic-Studios/Realm-Actions/oras-push@main
        with:
          artifact_name: ${{ env.ARTIFACT_NAME }}
          tag: pr-${{ github.event.number }}-${{ steps.sha.outputs.sha7 }}
          file_path: 'plugin/build/libs/game-plugin-all.jar'
          registry: ${{ env.REGISTRY }}
          registry_project: ${{ env.REGISTRY_PROJECT }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Dispatch PR Preview Build to Realm-Paper
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'Runic-Studios',
              repo: 'Realm-Paper',
              event_type: 'build-pr-preview',
              client_payload: {
                pr_number: '${{ github.event.number }}',
                sha7: '${{ steps.sha.outputs.sha7 }}',
                rr_game_tag: 'pr-${{ github.event.number }}-${{ steps.sha.outputs.sha7 }}'
              }
            });
