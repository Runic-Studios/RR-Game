[versions]
kotlin = "2.1.20"
kotlinx-serialization = "1.8.1"
paper = "1.21.5-R0.1-SNAPSHOT"
jackson = "2.18.3"
mccoroutine = "2.22.0"
guice = "7.0.0"
mongodb = "5.3.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktfmt = "com.ncorti.ktfmt.gradle:0.21.0"
shadow = "com.gradleup.shadow:8.3.6"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutine = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinx-serialization" }

# Guice
guice = { module = "com.google.inject:guice", version.ref = "guice" }
guice-assistedinject = { module = "com.google.inject.extensions:guice-assistedinject", version.ref = "guice" }

# Jackson (yaml parsing, config validation, etc)
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson"}

# Paper and shaded dependencies
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
mccoroutine-api = { module = "com.github.shynixn.mccoroutine:mccoroutine-bukkit-api", version.ref = "mccoroutine" }
mccoroutine-core = { module = "com.github.shynixn.mccoroutine:mccoroutine-bukkit-core", version.ref = "mccoroutine" }
adventure-legacy = "net.kyori:adventure-text-serializer-legacy:4.21.0"
aikar-commands = "co.aikar:acf-paper:0.5.1-SNAPSHOT"
odalitamenus = "io.github.odalita-developments.odalitamenus:core:0.6.2"
# MongoDB
mongodb-driver = { module = "org.mongodb:mongodb-driver-kotlin-coroutine", version.ref = "mongodb" }
mongodb-bson = { module = "org.mongodb:bson", version.ref = "mongodb" }

# Plugin dependencies
velagones-paper = "com.runicrealms.velagones:velagones-paper:0.1.6"
nbtapi = "de.tr7zw:item-nbt-api-plugin:2.15.5"
protocollib = "net.dmulloy2:ProtocolLib:5.4.0"
